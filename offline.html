<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f0c040">
<title>QuizMaster — Nincs kapcsolat</title>
<style>
  :root { --bg:#0a0a0f; --surface:#13131a; --border:#2a2a3d; --accent:#f0c040; --text:#f0f0f8; --muted:#6b6b8a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; text-align:center; }
  main { width:100%; max-width:340px; }
  .icon { font-size:64px; margin-bottom:18px; }
  h1 { font-size:30px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  p { font-size:15px; line-height:1.7; color:var(--muted); margin-bottom:28px; }
  button { width:100%; padding:16px; background:var(--accent); color:#000; border:none; border-radius:14px; font-size:18px; font-weight:700; letter-spacing:2px; cursor:pointer; }
  button:active { transform:scale(0.97); opacity:0.9; }
</style>
</head>
<body>
<main>
  <div class="icon">📡</div>
  <h1>Nincs kapcsolat</h1>
  <p>A QuizMaster játékhoz internetkapcsolat szükséges. Ellenőrizd a Wi-Fi vagy a mobilhálózat állapotát, majd próbáld újra!</p>
  <button type="button" id="retry">↺ ÚJRAPRÓBÁLÁS</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
